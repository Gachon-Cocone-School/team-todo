repos:
  - repo: local
    hooks:
      # 1. Ruff 린트 검사 및 자동 수정
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        pass_filenames: true

      # 2. Ruff 포맷 검사
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: true

      # 3. Mypy 타입 검사 (app/ 폴더가 존재할 때만 실행)
      - id: mypy
        name: mypy
        entry: bash -c '[ -d app ] && uv run mypy app/ || echo "app/ 없음, mypy 건너뜀"'
        language: system
        types: [python]
        pass_filenames: false

      # 4. Pytest 테스트 실행 (테스트 없음은 허용, 실패만 차단)
      - id: pytest
        name: pytest
        entry: bash -c 'uv run pytest tests/ -v --tb=short; code=$?; [ $code -eq 5 ] && exit 0 || exit $code'
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
