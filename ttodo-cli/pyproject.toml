[project]
name = "ttodo"
version = "0.1.0"
description = "Team Todo CLI"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13",
]

[project.scripts]
ttodo = "ttodo.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
